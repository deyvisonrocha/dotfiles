# ~/.config/kitty/kitty.conf

# Shell: usa o shell de login (definido via `make default-shell`)
shell .

# Fonte (Nerd Font necessária p/ ícones do eza/starship)
font_family      JetBrainsMono Nerd Font Mono
font_size        16.0
macos_thicken_font 0.75

# Tema
include dracula.conf

# Janela
background_opacity 0.65
background_blur 15
window_padding_width 8 10
remember_window_size yes
macos_titlebar_color background

# Comportamento
cursor_shape block
mouse_hide_wait -1
copy_on_select clipboard
confirm_os_window_close 0

# ALT como Meta (necessário p/ ALT-C do fzf no macOS)
macos_option_as_alt yes

shell_integration enabled

# Splits (atalhos no estilo iTerm/Ghostty)
enabled_layouts splits,stack
map cmd+d       launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+[       previous_window
map cmd+]       next_window
map cmd+w       close_window
