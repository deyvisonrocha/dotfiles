# style from https://github.com/brei0x/starship
format = """
[](gray)\
$os\
$username\
$directory\
[](bg:green fg:blue)\
$git_branch\
$git_status\
[](fg:green bg:yellow)\
$golang\
$nodejs\
$php\
$python\
$ruby\
$terraform\
[](fg:yellow bg:gray)\
$hostname\
[ ](fg:gray)\
$cmd_duration\
$fill\
[ ](fg:gray)\
$memory_usage\
$time\
[](blue)\
$line_break\
$character
"""

palette = 'brei0x'

# A continuation prompt that displays two filled-in arrows
continuation_prompt = '[❯❯](bold fg:muted)'

[os]
format = '[$symbol]($style)'
style = 'bg:gray fg:white'
disabled = false

[os.symbols]
Macos = ' '

[username]
format = '[  $user ]($style)'
style_root = 'bg:red fg:black bold'
style_user = 'bg:white fg:black'
#show_always = true

[directory]
truncation_length = 3
truncation_symbol = '…/'
format = '[ $read_only]($read_only_style)[$path ]($style)'
style = 'bg:blue fg:black'
read_only = ' '
read_only_style = 'bg:blue fg:red'

[directory.substitutions]
'~' = ' '
'Developer' = ' 󰲋 '
'Documents' = ' 󰈙 '
'Downloads' = '  '
'Music' = '  '
'Pictures' = '  '

[git_branch]
format = '[ $symbol $branch ]($style)'
symbol = ''
style = 'fg:black bg:green'

[git_status]
format = '[($all_status$ahead_behind )]($style)'
style = 'fg:black bg:green'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
deleted = ''

[golang]
format = '[ $symbol( $version) ]($style)'
symbol = ''
style = 'fg:black bg:yellow'

[nodejs]
format = '[ $symbol( $version) ]($style)'
symbol = ''
style = 'fg:black bg:yellow'

[php]
format = '[ $symbol( $version) ]($style)'
symbol = ''
style = 'fg:black bg:yellow'

[python]
format = '[ $symbol( $version)(\(#$virtualenv\)) ]($style)'
symbol = ''
style = 'fg:black bg:yellow'

[ruby]
format = '[ $symbol( $version) ]($style)'
symbol = '󰫏'
style = 'fg:black bg:yellow'

[terraform]
format = '[ $symbol( $version) ]($style)'
symbol = '󱁢'
style = 'fg:black bg:yellow'

[docker_context]
format = '[ $symbol ($context) ]($style)'
symbol = ''
style = 'fg:black bg:yellow'

[hostname]
#format = '[ $ssh_symbol$hostname]($style)'
format = '[  $hostname]($style)' # fix
ssh_only = false
ssh_symbol = ' '
trim_at = ''
style = 'fg:white bg:gray'

[cmd_duration]
format = ' in $duration '
style = 'bg:gray'
show_notifications = true
min_time_to_notify = 600000

[fill]
style = 'fg:muted'
symbol = '-'

[character]
success_symbol = '[❯](bold fg:muted)'
error_symbol = '[❯](bold fg:muted)'
vimcmd_symbol = '[❮](bold fg:blue)'
vimcmd_replace_one_symbol = '[❮](bold fg:yellow)'
vimcmd_replace_symbol = '[❮](bold fg:yellow)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[memory_usage]
format = '[ ${ram_pct} ]($style)'
style = 'fg:white bg:gray'
threshold = -1
disabled = false

[time]
format = '[  $time]($style)'
style = 'fg:black bg:blue'
time_format = '%R'
#time_format = '%I:%M %p'
disabled = false

[palettes.brei0x]
blue = '#4668a6'   # Navy blue (directory, time, vim normal mode)
green = '#4E9A06'  # Tango green (git branch/status, success prompt)
yellow = '#C4A000' # Tango gold (languages, vim replace/visual modes)
red = '#A63D40'    # Soft crimson (root user, read-only, error prompt)
gray = '#3e4451'   # Dark gray (OS icon, local IP, memory usage)
muted = '#5c6370'  # Muted gray (fill separator)
white = '#abb2bf'  # Off-white (text on gray backgrounds)
black = '#282c34'  # Charcoal (text on colored backgrounds)
